# GitHub Actions 部署模板（可选）
# ---------------------------------------------------------------
# 最简方案：在 Cloudflare Pages 控制台直接连接本仓库（Git 集成），
# 构建命令留空、输出目录填 "."，无需本工作流。
# 若改用 Direct Upload + Actions：
#   1. 把本文件复制到 .github/workflows/deploy.yml
#   2. 在仓库 Settings → Secrets and variables → Actions 添加两个密钥：
#      CLOUDFLARE_API_TOKEN（需 Cloudflare Pages:Edit 权限）
#      CLOUDFLARE_ACCOUNT_ID
#   3. 推送后自动部署到项目 detective-library
# 注意：用 Personal Access Token 推送工作流文件需要 workflow 权限。
# ---------------------------------------------------------------
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Cloudflare credentials
        id: cfg
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured yet; deployment skipped."
          fi

      - name: Install wrangler
        if: steps.cfg.outputs.ready == 'true'
        run: npm install -g wrangler

      - name: Ensure Pages project exists
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages project create detective-library --production-branch main || true

      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy . --project-name=detective-library --branch=main
